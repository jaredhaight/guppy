name: Tag

# Every merge to main that changes what users actually run becomes a release.
#
# Guppy is consumed by an auto-updater: a tag is not a bookkeeping entry, it is
# an ~8 MB download for every installed guppy on its next check. So the trigger
# is gated to the things that change the artifact — Go code and the install
# scripts. Docs, workflows, examples and tests merge without shipping anything.
on:
  push:
    branches:
      - main
    paths:
      # Order matters: the negation only subtracts from what the pattern above
      # it already matched. Moving '!**_test.go' above '**.go' silently turns
      # it back on.
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'install.sh'
      - 'install.ps1'

# Two merges landing together would otherwise both read the same highest tag
# and compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The counter is derived from the tags, so they all have to be here.
          fetch-depth: 0
          fetch-tags: true

      # vYYYY.DDD.N — year, zero-padded day of year, and the Nth release of
      # that day: v2026.209.1, v2026.209.2, v2027.003.1.
      #
      # ponytail: this sorts *below* the vYYYY.MMDD.N tags it replaces, because
      # guppy compares each dotted field numerically and a day of year never
      # reaches 728. Installs sitting on v2026.0728.24 won't see a new release
      # until 2027 and have to re-run install.sh once. Nothing to fix here; the
      # scheme is the ask.
      - name: Next version
        id: next
        run: |
          prefix="v$(date -u +%Y.%j)"
          # The grep is load-bearing: $NF of a stray tag like v2026.209.1-rc
          # would blow up the arithmetic below.
          n=$(git tag --list "${prefix}.*" \
            | grep -E "^${prefix}\.[0-9]+$" \
            | awk -F. '{print $NF}' \
            | sort -n | tail -1)
          version="${prefix}.$((${n:-0} + 1))"
          echo "Next version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # The tag itself is created by the release, not pushed from here. A tag
  # pushed with GITHUB_TOKEN does not trigger other workflows, so pushing one
  # would leave the release job sitting idle waiting for an event that never
  # arrives. Calling the workflow directly sidesteps that, and needs no PAT.
  release:
    name: Release
    needs: version
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
