name: Release

# Three ways in, one version. Normally tag.yml calls this on a merge to main
# that touched Go code or an install script, and passes the version it
# computed; the release creates the tag. A tag pushed by hand still works:
#
#   git tag -a v2026.209.1 -m 'v2026.209.1' && git push origin v2026.209.1
#
# Either way the tag -> artifact mapping stays reviewable, because the version
# is always an explicit input or the ref itself, never a run number.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Version to release, e.g. v2026.209.1'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v2026.209.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            output: guppy-linux-amd64
          - goos: linux
            goarch: arm64
            output: guppy-linux-arm64

          # macOS builds
          - goos: darwin
            goarch: amd64
            output: guppy-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: guppy-darwin-arm64

          # Windows builds
          - goos: windows
            goarch: amd64
            output: guppy-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: guppy-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patched toolchain: a released binary carries whatever
          # crypto/tls and crypto/x509 it was built with.
          go-version: 'stable'

      - name: Get version
        id: get_version
        env:
          # Empty on a tag push, where the ref is the version.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"

          # workflow_dispatch used to take no input, so running it from a
          # branch built with VERSION=main and published a release tagged
          # "main". That becomes 'latest', and every installed guppy then
          # fails parsing it as a version. Refuse anything shaped wrong.
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "refusing to release ${VERSION}: expected vYYYY.DDD.N" >&2
              exit 1
              ;;
          esac

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          # Passed through the environment rather than interpolated into the
          # script. VERSION is a git tag name, so expanding ${{ }} directly
          # inside run: would let a crafted tag close the quote and append
          # commands. OUTPUT comes from the matrix and is safe either way,
          # but the two travel together.
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          OUTPUT: ${{ matrix.output }}
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "${OUTPUT}" \
            ./cmd/guppy

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # OIDC token the attestation is signed with
      attestations: write # record the provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          # Shipped as release assets so the install one-liner points at a
          # tagged, checksummed script rather than whatever is on main.
          cp install.sh install.ps1 release/
          ls -lh release/

      - name: Get version
        id: get_version
        env:
          # Empty on a tag push, where the ref is the version.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"

          # workflow_dispatch used to take no input, so running it from a
          # branch built with VERSION=main and published a release tagged
          # "main". That becomes 'latest', and every installed guppy then
          # fails parsing it as a version. Refuse anything shaped wrong.
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "refusing to release ${VERSION}: expected vYYYY.DDD.N" >&2
              exit 1
              ;;
          esac

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      # checksums.txt only proves the files match themselves. It is signed by
      # nobody, and whoever can replace a binary can replace it too. Keep it
      # for convenience; the attestation below is the claim that carries
      # weight.
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      # Signed, verifiable evidence of which repo, workflow and commit
      # produced each binary. Users check it with:
      #   gh attestation verify guppy-linux-amd64 --repo jaredhaight/guppy
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/guppy-*
            release/install.*

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Creates the tag when it doesn't exist yet, which is the automatic
          # path. Nothing loops: a tag created with GITHUB_TOKEN doesn't
          # trigger the push-tags run above.
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
