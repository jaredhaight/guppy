name: Release

# Tag-driven, not push-to-main. A release is a deliberate act with a
# reviewable tag -> artifact mapping; building one on every merge means
# nobody can say which commit a given binary came from without digging
# through run numbers.
#
#   git tag -a v1.4.0 -m 'v1.4.0' && git push origin v1.4.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            output: guppy-linux-amd64
          - goos: linux
            goarch: arm64
            output: guppy-linux-arm64

          # macOS builds
          - goos: darwin
            goarch: amd64
            output: guppy-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: guppy-darwin-arm64

          # Windows builds
          - goos: windows
            goarch: amd64
            output: guppy-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: guppy-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patched toolchain: a released binary carries whatever
          # crypto/tls and crypto/x509 it was built with.
          go-version: 'stable'

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" \
            -o ${{ matrix.output }} \
            ./cmd/guppy

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # OIDC token the attestation is signed with
      attestations: write # record the provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # checksums.txt only proves the files match themselves. It is signed by
      # nobody, and whoever can replace a binary can replace it too. Keep it
      # for convenience; the attestation below is the claim that carries
      # weight.
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      # Signed, verifiable evidence of which repo, workflow and commit
      # produced each binary. Users check it with:
      #   gh attestation verify guppy-linux-amd64 --repo jaredhaight/guppy
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'release/guppy-*'

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
