name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Actions are pinned to a commit SHA, not a tag. A tag is mutable: whoever
# controls the action repo can repoint v4 at new code, and that code runs with
# access to this workflow's token. The trailing comment is the readable
# version — update both together.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patched toolchain rather than go.mod's minimum: stdlib CVEs
          # (crypto/tls, crypto/x509, net/http) ship in the toolchain, and
          # guppy's security rests on all three.
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check test coverage
        run: |
          echo "Generating coverage report..."
          go tool cover -func=coverage.out

          # Extract total coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Set minimum coverage threshold
          THRESHOLD=70.0

          # Compare coverage to threshold
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "ERROR: Test coverage ${COVERAGE}% is below the minimum threshold of ${THRESHOLD}%"
            exit 1
          else
            echo "SUCCESS: Test coverage ${COVERAGE}% meets the minimum threshold of ${THRESHOLD}%"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Build
        run: go build -v ./cmd/guppy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, not "latest": a linter that changes under you turns an
          # unrelated PR red and teaches people to ignore the lint job.
          version: v2.6.1
          args: --timeout=5m

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      # Reports only the vulnerabilities guppy actually reaches, in its
      # dependencies and in the standard library it was built against.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
